name: Build and publish PixelFlux
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      PROJECT: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: midoali250/bitvault-engine
          ref: 1eddc8c13afdd23c1bf14fcd669f9b8025f3a5b9
          path: engine-source
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android native build tools
        run: sdkmanager 'ndk;27.2.12479018' 'cmake;3.22.1' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Prepare exact cartridge and icon
        run: |
          python -m pip install pillow==11.1.0
          python "$PROJECT/scripts/prepare_rom.py"
          python "$PROJECT/scripts/make_icons.py"
      - name: Build core from BitVault registry
        run: |
          ln -s "$GITHUB_WORKSPACE/engine-source" "$PROJECT/android/engine-source"
          cd "$PROJECT/android"
          python ../scripts/build_android_cores.py
      - name: Package PixelFlux Android debug APK
        run: |
          cd "$PROJECT/android"
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
      - name: Verify signing identity and build signed APK
        env:
          PIXEL_ANDROID_RELEASE_SIGNING_JSON: ${{ secrets.PIXEL_ANDROID_RELEASE_SIGNING_JSON }}
        run: python "$PROJECT/scripts/build_signed_apk.py"
      - name: Check APK contains no updater and exactly the intended game
        run: |
          APK=$(find "$PROJECT/android/app/build/outputs/apk/debug" -name '*.apk' -type f -print -quit)
          unzip -l "$APK" | grep 'assets/roms/111kGbhhbliijXvVSg0gkwB2XYOwHdaPL.nes'
          ! unzip -l "$APK" | grep -E 'assets/updates/|UpdateClient|UpdateSecurity'
      - name: Download previous signed APK for install compatibility test
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release download pixelflux-v1.2 --pattern PixelFlux-Android-signed.apk --dir baseline
      - name: Reclaim disposable runner disk before emulator boot
        run: |
          rm -rf "$PROJECT/android/core-NES-arm64-v8a" "$PROJECT/android/core-NES-x86_64"
          sudo rm -rf /usr/share/dotnet /opt/ghc "$ANDROID_HOME/ndk/27.2.12479018"
          df -h "$HOME"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Exercise Android multicart and controls
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          disable-animations: true
          disk-size: 2048M
          emulator-boot-timeout: 180
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/android_smoke.sh && adb uninstall com.pixelflux.app && bash scripts/android_release_smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PixelFlux-Android
          path: PixelFlux-Android-signed.apk
          if-no-files-found: error
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-15
            platform: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PROJECT: .
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: msys2/setup-msys2@v2
        if: matrix.platform == 'windows'
        with:
          msystem: MINGW64
          update: false
          install: >-
            make
            git
            mingw-w64-x86_64-gcc
      - name: Verify shared engine core registry
        shell: bash
        run: python "$PROJECT/scripts/verify_engine.py"
      - name: Verify macOS architecture
        if: matrix.platform == 'macos'
        shell: bash
        run: test "$(uname -m)" = arm64
      - name: Build Windows NES core
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: cd "$PROJECT" && bash scripts/build_desktop_core.sh win
      - name: Build Unix NES core
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          cd "$PROJECT"
          if [ '${{ matrix.platform }}' = 'linux' ];then bash scripts/build_desktop_core.sh unix;else bash scripts/build_desktop_core.sh osx;fi
      - name: Install dependencies and prepare exact game
        shell: bash
        run: |
          python -m pip install pygame==2.6.1 pyinstaller==6.11.1 pillow==11.1.0 setuptools==70.3.0
          python "$PROJECT/scripts/prepare_rom.py"
          python "$PROJECT/scripts/make_icons.py"
      - name: Package Windows application
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          cd "$PROJECT"
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name PixelFlux --icon desktop/assets/icon.ico --add-data 'desktop/assets;assets' --add-data 'roms;roms' --add-data 'package-cores;cores' --add-data 'third-party-notices;third-party-notices' desktop/launcher.py
      - name: Package Linux application
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          cd "$PROJECT"
          python -m PyInstaller --noconfirm --clean --onedir --contents-directory . --name PixelFlux --add-data 'desktop/assets:assets' --add-data 'roms:roms' --add-data 'package-cores:cores' --add-data 'third-party-notices:third-party-notices' desktop/launcher.py
      - name: Package macOS application
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          cd "$PROJECT"
          python -m PyInstaller --noconfirm --clean --windowed --name PixelFlux --icon desktop/assets/icon.icns --add-data 'desktop/assets:assets' --add-data 'roms:roms' --add-data 'package-cores:cores' --add-data 'third-party-notices:third-party-notices' desktop/launcher.py
      - name: Test packaged Windows application
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $app=Join-Path $env:PROJECT 'dist/PixelFlux.exe'
          foreach ($argsLine in @('--smoke','--smoke --ci-game','--smoke --ci-controls','--smoke --ci-layout','--smoke --ci-turbo')) {
            $proc=Start-Process -Wait -PassThru -FilePath $app -ArgumentList $argsLine
            if ($proc.ExitCode -ne 0) { exit $proc.ExitCode }
          }
      - name: Test packaged Linux and macOS application
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          cd "$PROJECT"
          if [ '${{ matrix.platform }}' = 'linux' ];then APP=dist/PixelFlux/PixelFlux;else APP=dist/PixelFlux.app/Contents/MacOS/PixelFlux;fi
          "$APP" --smoke --screenshot pixelflux-home.png
          "$APP" --smoke --ci-game
          "$APP" --smoke --ci-controls
          "$APP" --smoke --ci-layout
          "$APP" --smoke --ci-turbo
      - name: Package portable Linux AppImage
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          cd "$PROJECT"
          mkdir -p AppDir/usr/bin
          cp -a dist/PixelFlux/. AppDir/usr/bin/
          cp desktop/assets/icon.png AppDir/pixelflux.png
          printf '[Desktop Entry]\nType=Application\nName=PixelFlux\nExec=PixelFlux\nIcon=pixelflux\nCategories=Game;Emulator;\nTerminal=false\n' > AppDir/pixelflux.desktop
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/usr/bin/PixelFlux" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo 'ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool' | sha256sum -c -
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir PixelFlux-Linux-x86_64.AppImage
      - name: Package macOS ZIP
        if: matrix.platform == 'macos'
        run: cd "$PROJECT" && ditto -c -k --sequesterRsrc --keepParent dist/PixelFlux.app PixelFlux-macOS-Apple-Silicon.zip
      - name: Collect Windows EXE
        if: matrix.platform == 'windows'
        shell: bash
        run: cp "$PROJECT/dist/PixelFlux.exe" PixelFlux-Windows-x64.exe
      - name: Upload Windows package
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: PixelFlux-Windows
          path: PixelFlux-Windows-x64.exe
          if-no-files-found: error
      - name: Upload Linux package
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: PixelFlux-Linux
          path: PixelFlux-Linux-x86_64.AppImage
          if-no-files-found: error
      - name: Upload macOS package
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: PixelFlux-macOS
          path: PixelFlux-macOS-Apple-Silicon.zip
          if-no-files-found: error
  release:
    needs: [android, desktop]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: PixelFlux-*
          path: release
          merge-multiple: true
      - name: Verify assets and publish a single release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd release
          test -f PixelFlux-Android-signed.apk
          test -f PixelFlux-Windows-x64.exe
          test -f PixelFlux-Linux-x86_64.AppImage
          test -f PixelFlux-macOS-Apple-Silicon.zip
          sha256sum PixelFlux-* > SHA256SUMS.txt
          gh release create pixelflux-v1.3 PixelFlux-Android-signed.apk PixelFlux-Windows-x64.exe PixelFlux-Linux-x86_64.AppImage PixelFlux-macOS-Apple-Silicon.zip SHA256SUMS.txt --title 'PixelFlux 1.3' --notes 'Single multicart, no updater. Windows and Linux binaries are unsigned; the macOS application is not notarized. Android is signed with the dedicated PixelFlux certificate. CI tests are not a substitute for physical-device testing.'
